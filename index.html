<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Team Scherzer - Bier & Spritz</title>
    <!-- Firebase v8 (funktioniert überall) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { color: #ff6b35; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; }
        
        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box {
            background: #2d2d2d;
            border: 3px solid #ff6b35;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .login-box h2 { color: #ff6b35; margin-bottom: 20px; }
        #passwordInput {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #444;
            border-radius: 10px;
            background: #1a1a1a;
            color: white;
            margin-bottom: 15px;
        }
        #loginBtn {
            width: 100%;
            padding: 15px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        #loginError {
            color: #e74c3c;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
        
        /* Main Content */
        #mainContent { display: none; }
        #mainContent.visible { display: block; }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .tab {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .tab.active { background: #ff6b35; color: white; }
        .tab:not(.active) { background: #444; color: #aaa; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .box {
            background: #2d2d2d;
            border: 2px solid #ff6b35;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .box h2 { color: #ff6b35; margin-bottom: 15px; font-size: 1.2rem; }
        
        #newTeam {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #444;
            border-radius: 10px;
            background: #1a1a1a;
            color: white;
            margin-bottom: 10px;
        }
        .save-btn {
            width: 100%;
            padding: 15px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .team-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .team-card:hover { border-color: #ff6b35; }
        .team-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .btn-minus { background: #e74c3c; color: white; }
        .btn-plus { background: #27ae60; color: white; }
        .btn-plus10 { background: #2ecc71; color: white; }
        .btn-delete {
            background: #444;
            color: #e74c3c;
            border: 2px solid #e74c3c;
            margin-left: auto;
        }
        
        .empty { text-align: center; color: #666; padding: 40px; font-style: italic; }
        
        .clear-btn {
            width: 100%;
            padding: 12px;
            background: #444;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
        }
        .clear-btn:hover { background: #e74c3c; }
        
        .rank-box { border-color: #2ecc71; }
        .rank-box h2 { color: #2ecc71; text-align: center; }
        .rank-item {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .rank-pos { font-size: 1.8rem; font-weight: bold; color: #ff6b35; width: 50px; }
        .rank-info { flex: 1; padding: 0 15px; }
        .rank-team { font-size: 1.2rem; font-weight: bold; }
        .rank-stats { color: #aaa; font-size: 0.9rem; margin-top: 5px; }
        .rank-total { font-size: 1.8rem; font-weight: bold; color: #ff6b35; }
        
        .sync-status {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .sync-status.online { color: #2ecc71; }
        .sync-status.offline { color: #e74c3c; }
        
        .notify {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: #2ecc71;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            display: none;
            z-index: 10000;
        }
        .notify.show { display: block; }
        .notify.error { background: #e74c3c; }
    </style>
</head>
<body>
    <!-- LOGIN OVERLAY -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔐 Admin Login</h2>
            <p style="color: #aaa; margin-bottom: 20px;">Passwort für Eingabe</p>
            <input type="password" id="passwordInput" placeholder="Passwort eingeben" autocomplete="off">
            <button id="loginBtn">Login</button>
            <div id="loginError">❌ Falsches Passwort!</div>
        </div>
    </div>
    
    <!-- MAIN CONTENT -->
    <div id="mainContent">
        <h1>🏁 Racing Team Scherzer</h1>
        <p class="subtitle">🍺 Bier & Spritz Wettbewerb 🍹</p>
        
        <div class="sync-status" id="syncStatus">Verbindung wird hergestellt...</div>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('input')">✏️ Eingabe</button>
            <button class="tab" onclick="showTab('rank')">🏆 Rangliste</button>
        </div>
        
        <!-- EINGABE -->
        <div id="input" class="page active">
            <div class="box">
                <h2>➕ Neues Team hinzufügen</h2>
                <input type="text" id="newTeam" placeholder="Teamname eingeben...">
                <button class="save-btn" onclick="saveTeam()">💾 SPEICHERN</button>
            </div>
            
            <div class="box">
                <h2>📋 Teams</h2>
                <div id="teamsList">
                    <div class="empty">Lade...</div>
                </div>
                <button class="clear-btn" onclick="clearData()">🗑️ Alle Daten löschen</button>
            </div>
        </div>
        
        <!-- RANGLISTE -->
        <div id="rank" class="page">
            <div class="box rank-box">
                <h2>🏆 Live-Rangliste</h2>
                <div id="rankList">
                    <div class="empty">Lade...</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="notify" id="notify"></div>
    
    <script>
        // Firebase Config
        var firebaseConfig = {
            apiKey: "AIzaSyA8NWueq1ck88WFgwfYF2JD5OA0o9y3q9U",
            authDomain: "bierwertung-8c213.firebaseapp.com",
            databaseURL: "https://bierwertung-8c213-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "bierwertung-8c213",
            storageBucket: "bierwertung-8c213.appspot.com",
            messagingSenderId: "255142714294",
            appId: "1:255142714294:web:264cebac1fe5cc6b863f17"
        };
        
        // Initialize Firebase (v8 style)
        firebase.initializeApp(firebaseConfig);
        var database = firebase.database();
        var teamsRef = database.ref('teams');
        var entriesRef = database.ref('entries');
        
        // Status
        var loggedIn = false;
        var ADMIN_PASSWORD = 'bier2024';
        
        // Verbindungsstatus
        database.ref('.info/connected').on('value', function(snap) {
            var status = document.getElementById('syncStatus');
            if (snap.val() === true) {
                status.textContent = '🟢 Online - Alle Geräte synchron';
                status.className = 'sync-status online';
            } else {
                status.textContent = '🔴 Offline';
                status.className = 'sync-status offline';
            }
        });
        
        // Login
        function doLogin() {
            var input = document.getElementById('passwordInput').value;
            if (input === ADMIN_PASSWORD) {
                loggedIn = true;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainContent').classList.add('visible');
                document.getElementById('loginError').style.display = 'none';
                notify('✅ Login OK!');
            } else {
                document.getElementById('loginError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
            }
        }
        
        document.getElementById('loginBtn').addEventListener('click', doLogin);
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doLogin();
        });
        
        // Tab wechseln
        function showTab(tab) {
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            document.getElementById(tab).classList.add('active');
            document.querySelectorAll('.tab').forEach(function(t) {
                t.classList.toggle('active', t.getAttribute('onclick').includes(tab));
            });
        }
        
        // Teams laden
        teamsRef.on('value', function(snapshot) {
            var teams = snapshot.val() || {};
            showTeams(teams);
        });
        
        // Einträge laden
        entriesRef.on('value', function(snapshot) {
            var entries = snapshot.val() || {};
            showRank(entries);
        });
        
        // Team speichern
        function saveTeam() {
            if (!loggedIn) {
                notify('⚠️ Bitte einloggen!', true);
                return;
            }
            
            var name = document.getElementById('newTeam').value.trim();
            if (!name) {
                notify('⚠️ Namen eingeben!', true);
                return;
            }
            
            teamsRef.once('value').then(function(snap) {
                var teams = snap.val() || {};
                var exists = false;
                Object.values(teams).forEach(function(t) {
                    if (t === name) exists = true;
                });
                
                if (exists) {
                    notify('⚠️ Existiert schon!', true);
                } else {
                    teamsRef.push(name);
                    document.getElementById('newTeam').value = '';
                    notify('✅ ' + name + ' gespeichert!');
                }
            });
        }
        
        document.getElementById('newTeam').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') saveTeam();
        });
        
        // Eintrag hinzufügen
        function add(teamKey, teamName, drink, amount) {
            if (!loggedIn) {
                notify('⚠️ Bitte einloggen!', true);
                return;
            }
            
            entriesRef.once('value').then(function(snap) {
                var entries = snap.val() || {};
                var current = 0;
                
                Object.values(entries).forEach(function(e) {
                    if (e.teamKey === teamKey && e.drink === drink) {
                        current += e.menge;
                    }
                });
                
                if (amount < 0 && current + amount < 0) {
                    notify('⚠️ Nicht unter 0!', true);
                    return;
                }
                
                entriesRef.push({
                    teamKey: teamKey,
                    teamName: teamName,
                    drink: drink,
                    menge: amount,
                    time: Date.now()
                });
                
                var icon = drink === 'bier' ? '🍺' : '🍹';
                notify((amount > 0 ? '+' : '') + amount + icon + ' ' + teamName);
            });
        }
        
        // Team löschen
        function delTeam(key, name) {
            if (!loggedIn) {
                notify('⚠️ Bitte einloggen!', true);
                return;
            }
            
            if (confirm('🗑️ ' + name + ' löschen?')) {
                teamsRef.child(key).remove();
                notify('✅ Gelöscht');
            }
        }
        
        // Alles löschen
        function clearData() {
            if (!loggedIn) {
                notify('⚠️ Bitte einloggen!', true);
                return;
            }
            
            if (confirm('🗑️ ALLES löschen?')) {
                teamsRef.remove();
                entriesRef.remove();
                notify('✅ Alles gelöscht');
            }
        }
        
        // Teams anzeigen
        function showTeams(teams) {
            var list = document.getElementById('teamsList');
            var arr = Object.entries(teams);
            
            if (arr.length === 0) {
                list.innerHTML = '<div class="empty">Keine Teams</div>';
                return;
            }
            
            list.innerHTML = arr.map(function(item) {
                var key = item[0];
                var name = item[1];
                return '<div class="team-card">' +
                    '<div class="team-name">' + name + '</div>' +
                    '<div class="btn-row">' +
                        '<button class="btn btn-minus" onclick="add(\'' + key + '\', \'' + name + '\', \'bier\', -1)">-1 🍺</button>' +
                        '<button class="btn btn-plus" onclick="add(\'' + key + '\', \'' + name + '\', \'bier\', 1)">+1 🍺</button>' +
                        '<button class="btn btn-plus10" onclick="add(\'' + key + '\', \'' + name + '\', \'bier\', 10)">+10 🍺</button>' +
                        '<span style="color:#666">|</span>' +
                        '<button class="btn btn-minus" onclick="add(\'' + key + '\', \'' + name + '\', \'spritz\', -1)">-1 🍹</button>' +
                        '<button class="btn btn-plus" onclick="add(\'' + key + '\', \'' + name + '\', \'spritz\', 1)">+1 🍹</button>' +
                        '<button class="btn btn-plus10" onclick="add(\'' + key + '\', \'' + name + '\', \'spritz\', 10)">+10 🍹</button>' +
                        '<button class="btn btn-delete" onclick="delTeam(\'' + key + '\', \'' + name + '\')">🗑️</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }
        
        // Rangliste
        function showRank(entries) {
            var stats = {};
            
            Object.values(entries).forEach(function(e) {
                if (!stats[e.teamName]) {
                    stats[e.teamName] = { bier: 0, spritz: 0, total: 0 };
                }
                stats[e.teamName][e.drink] += e.menge;
                stats[e.teamName].total += e.menge;
            });
            
            var sorted = Object.entries(stats)
                .filter(function(item) { return item[1].total > 0; })
                .sort(function(a, b) { return b[1].total - a[1].total; });
            
            var list = document.getElementById('rankList');
            if (sorted.length === 0) {
                list.innerHTML = '<div class="empty">Keine Einträge</div>';
                return;
            }
            
            list.innerHTML = sorted.map(function(item, i) {
                var team = item[0];
                var s = item[1];
                return '<div class="rank-item">' +
                    '<div class="rank-pos">#' + (i + 1) + '</div>' +
                    '<div class="rank-info">' +
                        '<div class="rank-team">' + team + '</div>' +
                        '<div class="rank-stats">🍺 ' + s.bier + ' | 🍹 ' + s.spritz + '</div>' +
                    '</div>' +
                    '<div class="rank-total">' + s.total + '</div>' +
                '</div>';
            }).join('');
        }
        
        // Notify
        function notify(msg, error) {
            var n = document.getElementById('notify');
            n.textContent = msg;
            n.style.background = error ? '#e74c3c' : '#2ecc71';
            n.classList.add('show');
            setTimeout(function() { n.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
