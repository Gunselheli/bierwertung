<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Team Scherzer - Bier & Spritz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { color: #ff6b35; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .tab {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .tab.active { background: #ff6b35; color: white; }
        .tab:not(.active) { background: #444; color: #aaa; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        /* Team hinzufügen */
        .add-box {
            background: #2d2d2d;
            border: 2px solid #ff6b35;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .add-box h2 {
            color: #ff6b35;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #444;
            border-radius: 10px;
            background: #1a1a1a;
            color: white;
            margin-bottom: 10px;
        }
        .save-btn {
            width: 100%;
            padding: 15px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
        .save-btn:hover { background: #ff8c42; }
        
        /* Team Liste */
        .teams-box {
            background: #2d2d2d;
            border: 2px solid #444;
            border-radius: 15px;
            padding: 20px;
        }
        .teams-box h2 {
            color: #ff6b35;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .team-card {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .team-card:hover { border-color: #ff6b35; }
        
        .team-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .btn-minus {
            background: #e74c3c;
            color: white;
        }
        .btn-plus {
            background: #27ae60;
            color: white;
        }
        .btn-plus10 {
            background: #2ecc71;
            color: white;
        }
        .btn-delete {
            background: #444;
            color: #e74c3c;
            border: 2px solid #e74c3c;
            margin-left: auto;
        }
        .btn-delete:hover {
            background: #e74c3c;
            color: white;
        }
        
        .empty {
            text-align: center;
            color: #666;
            padding: 40px;
            font-style: italic;
        }
        
        .clear-btn {
            width: 100%;
            padding: 12px;
            background: #444;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
        }
        .clear-btn:hover { background: #e74c3c; }
        
        /* Rangliste */
        .rank-box {
            background: #2d2d2d;
            border: 2px solid #2ecc71;
            border-radius: 15px;
            padding: 20px;
        }
        .rank-box h2 {
            color: #2ecc71;
            margin-bottom: 15px;
            font-size: 1.2rem;
            text-align: center;
        }
        
        .rank-item {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .rank-pos {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff6b35;
            width: 50px;
        }
        
        .rank-info {
            flex: 1;
            padding: 0 15px;
        }
        
        .rank-team {
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .rank-stats {
            color: #aaa;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        
        .rank-total {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ff6b35;
        }
        
        .notify {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: #2ecc71;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
        .notify.show { display: block; }
        .notify.error { background: #e74c3c; }
    </style>
</head>
<body>
    <h1>🏁 Racing Team Scherzer</h1>
    <p class="subtitle">🍺 Bier & Spritz Wettbewerb 🍹</p>
    
    <div class="tabs">
        <button class="tab active" onclick="showPage('input')">✏️ Eingabe</button>
        <button class="tab" onclick="showPage('rank')">🏆 Rangliste</button>
    </div>
    
    <!-- EINGABE SEITE -->
    <div id="input" class="page active">
        <div class="add-box">
            <h2>➕ Neues Team hinzufügen</h2>
            <input type="text" id="newTeam" placeholder="Teamname eingeben...">
            <button class="save-btn" onclick="saveTeam()">💾 SPEICHERN</button>
        </div>
        
        <div class="teams-box">
            <h2>📋 Teams</h2>
            <div id="teamsList">
                <div class="empty">Noch keine Teams vorhanden</div>
            </div>
            <button class="clear-btn" onclick="clearData()">🗑️ Alle Daten löschen</button>
        </div>
    </div>
    
    <!-- RANGLISTE SEITE -->
    <div id="rank" class="page">
        <div class="rank-box">
            <h2>🏆 Live-Rangliste</h2>
            <div id="rankList">
                <div class="empty">Noch keine Einträge</div>
            </div>
        </div>
    </div>
    
    <div class="notify" id="notify"></div>
    
    <script>
        // Daten speichern
        let teams = JSON.parse(localStorage.getItem('rsTeams')) || [];
        let entries = JSON.parse(localStorage.getItem('rsEntries')) || [];
        
        // Seite wechseln
        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(page).classList.add('active');
            document.querySelectorAll('.tab').forEach(t => {
                if (t.getAttribute('onclick').includes(page)) {
                    t.classList.add('active');
                } else {
                    t.classList.remove('active');
                }
            });
            if (page === 'rank') updateRank();
            if (page === 'input') showTeams();
        }
        
        // Team speichern
        function saveTeam() {
            const name = document.getElementById('newTeam').value.trim();
            if (!name) {
                notify('⚠️ Bitte Namen eingeben!', true);
                return;
            }
            if (teams.includes(name)) {
                notify('⚠️ Team existiert bereits!', true);
                return;
            }
            teams.push(name);
            localStorage.setItem('rsTeams', JSON.stringify(teams));
            document.getElementById('newTeam').value = '';
            showTeams();
            notify('✅ Team "' + name + '" gespeichert!');
        }
        
        // Enter-Taste
        document.getElementById('newTeam').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') saveTeam();
        });
        
        // Teams anzeigen
        function showTeams() {
            const list = document.getElementById('teamsList');
            if (teams.length === 0) {
                list.innerHTML = '<div class="empty">Noch keine Teams vorhanden</div>';
                return;
            }
            
            list.innerHTML = teams.map(team => `
                <div class="team-card">
                    <div class="team-name">${team}</div>
                    <div class="btn-row">
                        <button class="btn btn-minus" onclick="add('${team}', 'bier', -1)">-1 🍺</button>
                        <button class="btn btn-plus" onclick="add('${team}', 'bier', 1)">+1 🍺</button>
                        <button class="btn btn-plus10" onclick="add('${team}', 'bier', 10)">+10 🍺</button>
                        <span style="color:#666">|</span>
                        <button class="btn btn-minus" onclick="add('${team}', 'spritz', -1)">-1 🍹</button>
                        <button class="btn btn-plus" onclick="add('${team}', 'spritz', 1)">+1 🍹</button>
                        <button class="btn btn-plus10" onclick="add('${team}', 'spritz', 10)">+10 🍹</button>
                        <button class="btn btn-delete" onclick="removeTeam('${team}')">🗑️</button>
                    </div>
                </div>
            `).join('');
        }
        
        // Eintrag hinzufügen
        function add(team, drink, amount) {
            // Check minus
            if (amount < 0) {
                const current = entries
                    .filter(e => e.team === team && e.drink === drink)
                    .reduce((sum, e) => sum + e.menge, 0);
                if (current + amount < 0) {
                    notify('⚠️ Kann nicht unter 0!', true);
                    return;
                }
            }
            
            entries.push({
                team: team,
                drink: drink,
                menge: amount,
                time: Date.now()
            });
            localStorage.setItem('rsEntries', JSON.stringify(entries));
            
            const icon = drink === 'bier' ? '🍺' : '🍹';
            notify((amount > 0 ? '+' : '') + amount + icon + ' ' + team);
        }
        
        // Team löschen
        function removeTeam(team) {
            if (confirm('🗑️ Team "' + team + '" löschen?')) {
                teams = teams.filter(t => t !== team);
                localStorage.setItem('rsTeams', JSON.stringify(teams));
                showTeams();
                notify('✅ Team gelöscht');
            }
        }
        
        // Alle Daten löschen
        function clearData() {
            if (confirm('🗑️ ALLE Daten löschen?\n\nAlle Teams und Einträge werden gelöscht!')) {
                teams = [];
                entries = [];
                localStorage.removeItem('rsTeams');
                localStorage.removeItem('rsEntries');
                showTeams();
                notify('✅ Alle Daten gelöscht');
            }
        }
        
        // Rangliste aktualisieren
        function updateRank() {
            const stats = {};
            entries.forEach(e => {
                if (!stats[e.team]) stats[e.team] = { bier: 0, spritz: 0, total: 0 };
                stats[e.team][e.drink] += e.menge;
                stats[e.team].total += e.menge;
            });
            
            const sorted = Object.entries(stats)
                .filter(([_, s]) => s.total > 0)
                .sort((a, b) => b[1].total - a[1].total);
            
            const list = document.getElementById('rankList');
            if (sorted.length === 0) {
                list.innerHTML = '<div class="empty">Noch keine Einträge</div>';
                return;
            }
            
            list.innerHTML = sorted.map(([team, s], i) => `
                <div class="rank-item">
                    <div class="rank-pos">#${i + 1}</div>
                    <div class="rank-info">
                        <div class="rank-team">${team}</div>
                        <div class="rank-stats">🍺 ${s.bier} | 🍹 ${s.spritz}</div>
                    </div>
                    <div class="rank-total">${s.total}</div>
                </div>
            `).join('');
        }
        
        // Benachrichtigung
        function notify(msg, error) {
            const n = document.getElementById('notify');
            n.textContent = msg;
            n.className = error ? 'notify error show' : 'notify show';
            setTimeout(() => n.classList.remove('show'), 2000);
        }
        
        // Start
        showTeams();
    </script>
</body>
</html>
